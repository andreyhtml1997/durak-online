<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e5c3a"/>
      <stop offset="100%" stop-color="#0b2416"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.7"/>
  <!-- Left Card -->
  <g transform="translate(230,270) rotate(-14)">
    <rect x="-85" y="-125" width="170" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <text x="-62" y="-82" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#1e293b">A</text>
    <text x="-60" y="-48" font-family="Arial" font-size="32" fill="#1e293b">♠</text>
    <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="88" fill="#1e293b">♠</text>
  </g>
  <!-- Right Trump Card -->
  <g transform="translate(285,260) rotate(12)">
    <rect x="-85" y="-125" width="170" height="250" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="5"/>
    <text x="-62" y="-82" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#dc2626">A</text>
    <text x="-60" y="-48" font-family="Arial" font-size="32" fill="#dc2626">♥</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial" font-size="92" fill="#dc2626">♥</text>
  </g>
</svg>